services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: placement_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/placement_copilot
      JWT_SECRET_KEY: change-me-in-env
    ports:
      - "8000:8000"
    depends_on:
      - db
